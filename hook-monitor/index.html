<!doctype html><html lang="ko"><meta charset="utf-8"><title>Ghost-ALICE 사례 모니터</title>
<style>body{font:15px system-ui;background:#101721;color:#eaf1fa;margin:24px;line-height:1.5}h1{margin:0}.muted{color:#9eb0c5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.panel{background:#1b2837;border:1px solid #34465b;border-radius:12px;padding:18px;margin:16px 0}label{display:block;margin:10px 0 4px}input,textarea,select{box-sizing:border-box;width:100%;background:#101721;color:#eaf1fa;border:1px solid #486079;border-radius:7px;padding:9px;font:inherit}textarea{min-height:65px}button{background:#337d70;color:white;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;margin-top:10px}.msg{padding:10px;background:#101721;border-left:3px solid #486079;margin:8px 0;white-space:pre-wrap;max-height:250px;overflow:auto}.user{border-color:#6ca9f2}.assistant{border-color:#70dfac}.tool{border-color:#ffbd70}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #34465b}.small{font-size:12px}.bad{color:#ffad9a}.good{color:#70dfac}</style>
<h1>Ghost-ALICE 사례 모니터</h1><div class="muted">사례 → 실제 대화 → 훅·원장 → 조건별 판정</div><p id="status" class="panel">확인 중</p>
<div class="grid"><section class="panel"><h2>1. 사례</h2><label>사례 ID<input id="cid"></label><label>사전 문맥<textarea id="context"></textarea></label><label>사용자 입력<textarea id="prompt"></textarea></label><label>기대 행동<textarea id="expected"></textarea></label><label>실패 조건: 한 줄에 하나<textarea id="conditions"></textarea></label><button id="saveCase">사례 저장</button><p id="caseMsg"></p></section>
<section class="panel"><h2>2. Claude Code 대화 기록</h2><label>실시간 세션<select id="live"><option value="">자동 선택</option></select></label><p class="muted small">채팅 중 새 메시지가 1초마다 표시됩니다. 아래 파일 선택은 자동 연결이 안 되는 기록에만 사용하세요.</p><label>구간<select id="phase"><option value="before">수정 전</option><option value="after">수정 후 / 재현</option></select></label><label>세션 JSONL 파일<input id="file" type="file" accept=".jsonl,.json,.txt"></label><label>세션 ID (파일에 없는 경우)<input id="sid"></label><button id="upload">기록 불러오기</button><p id="uploadMsg"></p><label>표시할 실행<select id="runs"><option value="">선택</option></select></label></section></div>
<div class="grid"><section class="panel"><h2>3. 실제 답변·도구 호출</h2><div id="messages" class="muted">대화 기록을 제공하세요.</div></section><section class="panel"><h2>4. 실패 조건 판정</h2><div id="rubric">사례를 저장하세요.</div><label>판정 근거 / 재현 메모<textarea id="note"></textarea></label><button id="saveVerdict">판정 저장</button><p id="verdictMsg"></p><div id="summary"></div></section></div>
<section class="panel"><h2>5. 같은 세션의 훅·원장</h2><p id="flow" class="muted"></p><table><thead><tr><th>시각</th><th>출처</th><th>단계</th><th>훅 / 도구</th><th>결과</th></tr></thead><tbody id="events"></tbody></table><p id="paths" class="muted small"></p></section>
<section class="panel"><h2>6. 저장된 결과 다시 보기</h2><label>저장한 판정<select id="saved"><option value="">선택하세요</option></select></label><div id="savedView" class="muted">저장한 판정을 선택하면 사례, 답변, 훅 기록, 판정 근거가 표시됩니다.</div></section>
<script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let state={},run=null,dirty=false,rubricKey="",liveSig="",runsSig="",savedSig="",savedViewKey="";
async function post(path,value){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});return r.json()}
function caseData(){return {id:$('cid').value,context:$('context').value,prompt:$('prompt').value,expected:$('expected').value,conditions:$('conditions').value}}
function renderSaved(){const results=state.saved_results||[],sig=results.map(x=>x.saved_at+'|'+x.session).join('|'),old=$('saved').value;if(sig!==savedSig){$('saved').innerHTML='<option value="">선택하세요</option>'+results.map((x,i)=>`<option value="${i}">${esc(x.case?.id||'사례')} · ${esc(x.phase)} · ${esc(x.saved_at)}</option>`).join('');$('saved').value=old;savedSig=sig}const key=$('saved').value;if(key===savedViewKey)return;savedViewKey=key;const x=results[Number(key)];if(key===''||!x){$('savedView').textContent='저장한 판정을 선택하세요.';return}const verdict=Object.entries(x.verdict||{}).map(([condition,result])=>`<tr><td>${esc(condition)}</td><td>${result==='fail'?'실패 조건 충족':'실패 조건 없음'}</td></tr>`).join('');const messages=(x.messages||[]).map(m=>`<div class="msg ${esc(m.role)}"><b>${esc(m.role)} · ${esc(m.ts)}</b><br>${esc(m.text)}</div>`).join('');const hooks=(x.events||[]).map(e=>`<tr><td>${esc(e.ts)}</td><td>${esc(e.source)}</td><td>${esc(e.stage)}</td><td>${esc(e.hook||e.tool)}</td><td>${esc(e.exit_code===undefined?'기록':e.exit_code)}</td></tr>`).join('');$('savedView').innerHTML=`<p><b>세션:</b> ${esc(x.session)} · <b>구간:</b> ${esc(x.phase)}</p><p><b>사전 문맥:</b> ${esc(x.case?.context)}</p><p><b>사용자 입력:</b> ${esc(x.case?.prompt)}</p><p><b>기대 행동:</b> ${esc(x.case?.expected)}</p><h3>판정</h3><table>${verdict}</table><p><b>근거:</b> ${esc(x.note)}</p><h3>대화·도구 호출</h3>${messages||'저장된 대화 없음'}<h3>훅·원장 이벤트</h3><table>${hooks}</table>`}
function render(){const c=state.case||{};if(!dirty){for(const [k,id] of Object.entries({id:'cid',context:'context',prompt:'prompt',expected:'expected',conditions:'conditions'}))$(id).value=c[k]||''}const live=state.live_sessions||{},liveOld=$('live').value,newLiveSig=Object.keys(live).sort().join('|');if(newLiveSig!==liveSig){$('live').innerHTML='<option value="">최근 세션 자동 선택</option>'+Object.entries(live).sort((a,b)=>b[1].updated-a[1].updated).map(([id])=>`<option value="${esc(id)}">${esc(id)}</option>`).join('');$('live').value=liveOld;liveSig=newLiveSig}const liveId=$('live').value||Object.entries(live).sort((a,b)=>b[1].updated-a[1].updated)[0]?.[0];const all=state.runs||[],old=$('runs').value,newRunsSig=all.map((x,i)=>x.messages?i+':'+x.saved_at:'').join('|');if(newRunsSig!==runsSig){$('runs').innerHTML='<option value="">선택</option>'+all.map((x,i)=>x.messages?`<option value="${i}">${esc(x.phase)} · ${esc(x.session||'세션 없음')} · ${esc(x.saved_at)}</option>`:'').join('');$('runs').value=old||'';runsSig=newRunsSig}run=$('runs').value!==''&&all[Number($('runs').value)]?.messages?all[Number($('runs').value)]:liveId?{session:liveId,phase:$('phase').value,messages:live[liveId].messages,saved_at:'live'}:null;$('status').textContent=(state.settings?.disabled?'훅 꺼짐':'훅 켜짐')+' · 새 이벤트 '+(state.events?.length||0)+'개';$('paths').textContent='훅 이벤트: '+state.capture+' · 실시간 대화: '+state.live_path+' · 대화/판정: '+(state.runs_path||'captures/runs.jsonl');$('messages').innerHTML=run?run.messages.map(m=>`<div class="msg ${esc(m.role)}"><b>${esc(m.role)} · ${esc(m.ts)}</b><br>${esc(m.text)}</div>`).join(''):'대화 기록을 제공하세요.';const conditions=(c.conditions||'').split('\n').map(x=>x.trim()).filter(Boolean);const newKey=(run?.session||'')+'|'+(run?.saved_at||'')+'|'+(c.conditions||'');if(newKey!==rubricKey){$('rubric').innerHTML=conditions.map((x,i)=>`<label>${esc(x)}<select id="v${i}"><option value="unknown">미판정</option><option value="fail">실패 조건 충족</option><option value="pass">실패 조건 없음</option></select></label>`).join('')||'사례를 저장하세요.';rubricKey=newKey}const ev=(state.events||[]).filter(x=>run?.session&&x.session===run.session);$('flow').textContent=['SessionStart','UserPromptSubmit','PreToolUse','PostToolUse','Stop'].map(x=>(ev.some(v=>v.stage===x)?'● ':'○ ')+x).join(' → ');$('events').innerHTML=ev.slice().reverse().map(v=>`<tr><td>${esc(v.ts)}</td><td>${esc(v.source)}</td><td>${esc(v.stage)}</td><td>${esc(v.hook||v.tool)}</td><td class="${v.exit_code?'bad':'good'}">${v.exit_code===undefined?'기록':v.exit_code===0?'성공':'오류 '+v.exit_code}</td></tr>`).join('')||'<tr><td colspan="5">선택한 세션과 연결된 새 이벤트 없음</td></tr>';const counts={before:[0,0],after:[0,0]};for(const a of all){if(a.kind!=='assessment'||!counts[a.phase])continue;counts[a.phase][1]++;if(Object.values(a.verdict||{}).includes('fail'))counts[a.phase][0]++}$('summary').textContent=`저장된 판정: 수정 전 ${counts.before[0]}/${counts.before[1]} 실패 · 수정 후 ${counts.after[0]}/${counts.after[1]} 실패`}
async function refresh(){try{state=await(await fetch('/api')).json();render();renderSaved()}catch(e){$('status').textContent='서버 연결 오류'}}
for(const id of ['cid','context','prompt','expected','conditions'])$(id).oninput=()=>dirty=true;
$('saveCase').onclick=async()=>{const r=await post('/api/case',caseData());$('caseMsg').textContent=r.ok?'저장됨: '+r.path:r.error;dirty=false;await refresh()};
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f){$('uploadMsg').textContent='파일을 선택하세요';return}const r=await post('/api/transcript',{raw:await f.text(),session:$('sid').value,phase:$('phase').value});$('uploadMsg').textContent=r.ok?r.run.messages.length+'개 메시지 저장: '+r.path:r.error;await refresh();if(r.ok){const opts=[...$('runs').options];$('runs').value=opts.at(-1).value;render()}};
$('runs').onchange=()=>render();$('live').onchange=()=>render();$('saved').onchange=()=>{savedViewKey='';renderSaved()};$('saveVerdict').onclick=async()=>{if(!run){$('verdictMsg').textContent='실행을 먼저 선택하세요';return}const lines=(state.case?.conditions||'').split('\n').map(x=>x.trim()).filter(Boolean),verdict={};lines.forEach((x,i)=>verdict[x]=$('v'+i).value);if(!lines.length||Object.values(verdict).includes('unknown')){$('verdictMsg').textContent='모든 조건을 판정하세요';return}const r=await post('/api/verdict',{session:run.session,phase:run.phase,verdict,note:$('note').value,messages:run.messages});$('verdictMsg').textContent=r.ok?'판정 저장됨: '+r.path:r.error;await refresh()};
refresh();setInterval(refresh,1000);
</script></html>
